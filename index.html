    <title>Cody On A Boat</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
        background: #000;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      #game-container {
        touch-action: none;
      }
      /* No rotate-to-landscape hint: the game is nearly square (256x224),
         so portrait width-fit is already the best a phone can do — rotating
         doesn't make it bigger, it just adds browser chrome. */
    </style>
    <script type="module" crossorigin src="./assets/index-BA5NnnJU.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <script>
      // Register the offline-cache service worker in production only. On
      // localhost the cache-first SW serves stale Vite modules across edits,
      // silently masking code changes during development.
      const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && !isLocalDev) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
      if ('serviceWorker' in navigator && isLocalDev) {
        // Clean up any SW a previous dev session left behind.
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
        if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
      }
    </script>
  </body>
